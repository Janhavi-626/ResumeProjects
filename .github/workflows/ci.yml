name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt ruff
      - run: ruff check backend --select E9,F63,F7,F82
      - run: python -m compileall -q backend/app backend/scripts backend/evaluation
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:////tmp/agentic_returns_ci.db

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend